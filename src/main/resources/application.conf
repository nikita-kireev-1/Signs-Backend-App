ktor {
    deployment {
        port = 8080
        port = ${?ktor.deployment.port}
        port = ${?KTOR_DEPLOYMENT_PORT}

        host = "0.0.0.0"
        host = ${?ktor.deployment.host}
        host = ${?KTOR_DEPLOYMENT_HOST}
    }
    application {
        modules = [ com.example.api.ApplicationKt.module ]
    }
}

db {
    url = "jdbc:postgresql://localhost:5432/mydb"
    url = ${?db.url}
    url = ${?DB_URL}

    user = "postgres"
    user = ${?db.user}
    user = ${?DB_USER}

    password = "postgres"
    password = ${?db.password}
    password = ${?DB_PASSWORD}

    driver = "org.postgresql.Driver"
    driver = ${?db.driver}
}

app {
    env = "dev"
    env = ${?app.env}
    env = ${?APP_ENV}
}

jwt {
    secret = "change-me-in-prod"
    secret = ${?jwt.secret}
    secret = ${?JWT_SECRET}

    issuer = "signs-server"
    issuer = ${?jwt.issuer}
    issuer = ${?JWT_ISSUER}

    audience = "signs-client"
    audience = ${?jwt.audience}
    audience = ${?JWT_AUDIENCE}

    expiresInMs = 3600000
    expiresInMs = ${?jwt.expiresInMs}
    expiresInMs = ${?JWT_EXPIRESINMS}
}